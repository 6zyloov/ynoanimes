name: ios-build

on:
  push:
    branches: [main]
    paths:
      - 'ynoanimes/**'
      - 'Tests/**'
      - 'ynoanimes.xcodeproj/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: test local library store
        run: |
          swiftc ynoanimes/LibraryData.swift Tests/LibraryStoreSmokeTests.swift -o /tmp/yno-library-tests
          /tmp/yno-library-tests

      - name: show xcode version
        run: |
          uname -m
          xcodebuild -version

      - name: build for generic iOS device
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ynoanimes.xcodeproj \
            -scheme ynoanimes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log

      - name: install ldid-procursus
        run: brew install ldid-procursus

      - name: package unsigned and TrollStore IPAs
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ynoanimes.app"
          test -d "$APP_PATH"
          mkdir -p build/Unsigned/Payload build/TrollStore/Payload
          cp -R "$APP_PATH" build/Unsigned/Payload/ynoanimes.app
          cp -R "$APP_PATH" build/TrollStore/Payload/ynoanimes.app
          # Fake-sign only for TrollStore; this is not an Apple certificate signature.
          ldid -S build/TrollStore/Payload/ynoanimes.app/ynoanimes
          (cd build/Unsigned && /usr/bin/zip -qry ../ynoanimes-unsigned.ipa Payload)
          (cd build/TrollStore && /usr/bin/zip -qry ../ynoanimes-trollstore.ipa Payload)
          unzip -t build/ynoanimes-unsigned.ipa
          unzip -t build/ynoanimes-trollstore.ipa
          shasum -a 256 build/ynoanimes-unsigned.ipa build/ynoanimes-trollstore.ipa | tee build/ipa-sha256.txt

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ynoanimes-ipa-packages
          path: |
            build/ynoanimes-unsigned.ipa
            build/ynoanimes-trollstore.ipa
            build/ipa-sha256.txt
            build/xcodebuild.log
          if-no-files-found: error
          retention-days: 14
